<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="layout.css">
</head>
<body>
<header>
  <a class="logo" href="index.html">🐾 NobleTails</a>
  <button id="menuBtn" aria-label="menu">☰</button>
  <nav id="navLinks">
    <a href="index.html">Home</a>
    <a href="home.html">Adopt</a>
    <a href="calculator.html">Food Calculator</a>

    <a href="signin.html">Sign In</a>
    <button id="themeBtn">☀ Light</button>
  </nav>
</header>
<main class="formpage">
  <h2>Create Account</h2>
  <form id="signupForm" novalidate>
    <label>Email</label>
    <input type="email" id="suEmail">
    <label>Password</label>
    <input type="password" id="suPass">
    <label>Confirm Password</label>
    <input type="password" id="suConfirm">
    <label class="check"><input type="checkbox" id="terms"> I agree to the Terms of Service</label>
    <span class="error-msg" id="termsErr"></span>
    <button type="submit" id="suBtn" class="btn" disabled>Sign Up</button>
    <p id="suMsg" class="ok"></p>
  </form>
  <p>Already have an account? <a href="signin.html">Sign in</a></p>
</main>
<footer>
  <p>🐾 NobleTails - Rescue · Rehabilitate · Rehome</p>
  <p class="small">A web technology project (25CS208), Karunya Institute of Technology and Sciences</p>
</footer>
<script src="validation.js"></script>
<script src="theme.js"></script>
</body>
</html>
